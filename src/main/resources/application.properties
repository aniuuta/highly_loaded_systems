spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA & HIBERNATE ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.default_schema=public

# === CONNECTION POOL ===
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# === FLYWAY CONFIG ===
spring.flyway.enabled=true
#spring.flyway.locations=classpath:V1__init.sql
#spring.flyway.enable-migrations-trx=false
#spring.flyway.schemas=public
#spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true

# === SERVER CONFIG (Tomcat) ===
server.tomcat.max-threads=${SERVER_TOMCAT_MAX_THREADS:100}

kafka.hosts=${KAFKA_HOSTS:hl22.zil:9094,hl23.zil:9094}
kafka.groupId=${KAFKA_GROUP_ID:larina-consumer-group}
kafka.topic=${KAFKA_TOPIC:var08}
kafka.concurrency=${KAFKA_CONCURRENCY:2}
