version: '7.0'

services:

  app:
    image: aniuuta/module1
    #build: .
    container_name: app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hl21.zil:5432/kor
#      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/kor
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_TOMCAT_MAX_THREADS: "200"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M