services:
  app:
    image: aniuuta/module1
    #build: .
    container_name: app
    ports:
      - "8080:8080"
    networks:
      - app-network
    environment:
      #SPRING_DATASOURCE_URL: jdbc:postgresql://hl21.zil:5432/kor
      DB_HOST: ${DB_HOST:-10.60.3.26}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-kor}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_TOMCAT_MAX_THREADS: "200"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2048M
        reservations:
          cpus: '0.5'  # Резервирование CPU
          memory: 256M  # Резервирование памят

  additional-service:
    #build:
    #  context: ../additional-service
    #  dockerfile: Dockerfile
    image: aniuuta/additional-service
    container_name: additional-service
    restart: always
    ports:
      - "8081:8081"
    networks:
      - app-network
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.5'  # лимиты для CPU
          memory: 512M  # лимиты для памяти
        reservations:
          cpus: '0.5'  # Резервирование CPU
          memory: 256M  # Резервирование памят
    environment:
      FIXED_RATE_MS: ${FIXED_RATE_MS:-60000}
      APP_HOST: ${SHOP_TOTAL_COST_HOST:-localhost}
      APP_PORT: ${SHOP_TOTAL_COST_PORT:-8081}
      CORE_SERVICE_HOST: ${CORE_SERVICE_HOST:-app}
      CORE_SERVICE_PORT: ${CORE_SERVICE_PORT:-8080}
      KAFKA_HOSTS: ${KAFKA_HOSTS:-hl22.zil:9094,hl23.zil:9094}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-larina-consumer-group}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-var08}
      KAFKA_CONCURRENCY: ${KAFKA_CONCURRENCY:-2}
networks:
  app-network:
    driver: bridge