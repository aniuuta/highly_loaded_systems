version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: progress_db
    ports:
      - "5432:5432"
    volumes:
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  initdb:
    image: python:3.9-slim
    container_name: initdb
    depends_on:
      postgres:
        condition: service_healthy  # Дождемся, пока postgres будет готов
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "apt-get update && 
             apt-get install -y libpq-dev python3-dev &&
             pip install psycopg2-binary faker &&
             python initdb.py"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sirius_java_project_app
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: