spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://10.60.3.26/kor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA & HIBERNATE ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.default_schema=public

# === CONNECTION POOL ===
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# === FLYWAY CONFIG ===
spring.flyway.enabled=true
#spring.flyway.locations=classpath:V1__init.sql
#spring.flyway.enable-migrations-trx=false
#spring.flyway.schemas=public
#spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true

# === SERVER CONFIG (Tomcat) ===
server.tomcat.max-threads=${SERVER_TOMCAT_MAX_THREADS:100}
